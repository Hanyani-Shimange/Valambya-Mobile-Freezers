<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>valambyamobilefreezers</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="site-title">Valambya Mobile Freezers</div>
            <nav class="site-nav">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="enquiry.html">Enquiry</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="card">
                <h2>Make an Enquiry</h2>
                <p>Looking for a reliable mobile freezer? Complete the form below and we'll get back to you with availability and pricing.</p>
            </section>

            <section class="card" style="margin-top:1rem;">
                <form action="#" method="post">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name">

                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address">

                    <label for="company">Company / Business Name (optional)</label>
                    <input type="text" id="company" name="company" placeholder="Enter company or business name">

                    <label for="services">Services Required</label>
                    <input type="text" id="services" name="services" placeholder="e.g. Mobile Freezer Hire">

                    <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
                        <div style="flex:1;">
                            <label for="date_required">Date Required</label>
                            <input type="date" id="date_required" name="date_required">
                        </div>
                        <div style="flex:1;">
                            <label for="date_return">Date Of Return</label>
                            <input type="date" id="date_return" name="date_return">
                        </div>
                    </div>

                    <label for="location">Delivery / Event Location</label>
                    <input type="text" id="location" name="location" placeholder="Enter delivery or event location">

                    <label for="quantity">Number Of Freezers Required</label>
                    <input type="number" id="quantity" name="quantity" placeholder="Enter number of freezers">

                    <label for="notes">Additional Information / Requirements</label>
                    <textarea id="notes" name="notes" placeholder="Enter additional information" rows="4"></textarea>

                    <div style="margin-top:1rem;">
                        <button class="btn btn-primary" type="submit">Submit Enquiry</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; Valambya Mobile Freezers. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
